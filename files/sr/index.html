<!DOCTYPE html>
<html lang="en">
	<head>
		<base href="https://cdn.jsdelivr.net/gh/qulearning/qulearning.github.io@main/files/sr/">
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
		<title>SR</title>
		<link rel="stylesheet" href="themes.css" />
		<style>
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: #000;
			}

			.webgl-content {
				width: 100%;
				height: 100%;
			}

			#gameContainer {
				width: 100%;
				height: 100%;
				margin: 0;
			}
		</style>
		<script src="UnityProgress.js" defer></script>
		<script src="UnityLoader.js" defer></script>
	</head>
	<body>
		<div class="webgl-content">
			<div id="gameContainer"></div>
		</div>

		<script>
		window.addEventListener("load", function () {
		    var gameInstance = UnityLoader.instantiate(
		        "gameContainer",
		        "SnowRider3D-gd-1.json",
		        {
		            onProgress: function(unityInstance, progress) {
		                UnityProgress(unityInstance, progress);
		                if (progress == 1) {
		                    document.getElementById("gameContainer").querySelector("canvas").style.display = "block";
		                    var loadingScreen = document.getElementById("gameContainer").querySelector("div");
		                    if (loadingScreen) loadingScreen.style.display = "none";
		                }
		            }
		        }
		    );
		});
		</script>
	</body>
</html>
