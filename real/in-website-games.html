<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>A website</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="page-wrapper">
            <div id="navbar-placeholder"></div>

            <div class="content">
                <h1>Play in Website</h1>

                <div class="button-group">
                    <button onclick="loadGame('/files/gd/')">Geometry Dash</button>
                    <button onclick="loadGame('/files/gd_sz/')">Geometry Dash Subzero</button>
                    <button onclick="loadGame('/files/dm/')">Drive Mad</button>
                    <button onclick="loadGame('/files/bitlife/')">Bitlife</button>
                </div>

                <div class="button-group" style="margin-top: 15px;">
                    <button onclick="loadGame('/files/tag/')">Tag</button>
                    <button onclick="loadGame('/files/tmtd/')">Ten Minutes Till Dawn</button>
                    <button onclick="loadGame('/files/cluster_rush/')">Cluster Rush</button>
                </div>

                <div class="button-group" style="margin-top: 15px;">
                    <button onclick="loadGame('/files/rb/')">Retro Bowl (broken)</button>
                    <button onclick="loadGame('/files/sr/')">Snow Rider</button>
                    <button onclick="loadGame('/files/tu95/')">Tu-95</button>
                </div>

                <div id="game-area" style="margin-top:20px; width:100%; height:70vh;">
                    <iframe
                        id="game-frame"
                        style="width:100%; height:100%; border:none; display:none;"
                        sandbox="allow-scripts allow-same-origin allow-pointer-lock"
                        allow="fullscreen">
                    </iframe>
                </div>

                <p style="margin-top:15px;">
                    Note: the website version of Snow Rider has some minor bugs. For a more stable version, download Snow Rider and run it locally instead.
                </p>
            </div>
        </div>
        <script>
            function loadGame(path) {
                const content = document.querySelector('.content');

                content.innerHTML = `
                    <iframe
                        src="${path}"
                        style="width:100%; height:100%; border:none;"
                        sandbox="allow-scripts allow-same-origin allow-pointer-lock"
                        allow="fullscreen">
                    </iframe>
                `;
            }
        </script>
        <script src="load-navbar.js"></script>
    </body>
</html>
