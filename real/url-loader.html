<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <div id="navbar-placeholder"></div>

        <div class="content">
            <div class="container">
                <h2>URL Loader (only for static websites)</h2>
                <div class="input-row">
                    <input type="text" id="urlInput" placeholder="https://example.com">
                    <button onclick="loadWebsite()">Load</button>
                </div>

                <div id="siteWrapper" style="width: 100%; height: 80vh; border:1px solid #000;"></div>

                <script>
                async function loadWebsite() {
                    const url = document.getElementById('urlInput').value;
                    if (!url) return alert('Please enter a URL');

                    const proxyUrl = 'https://cors-anywhere.herokuapp.com/' + url;

                    try {
                        const response = await fetch(proxyUrl, {
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });

                        if (!response.ok) throw new Error('Network response was not ok');

                        const html = await response.text();

                        const iframe = document.createElement('iframe');
                        iframe.style.width = '100%';
                        iframe.style.height = '100%';
                        iframe.style.border = 'none';

                        const wrapper = document.getElementById('siteWrapper');
                        wrapper.innerHTML = '';
                        wrapper.appendChild(iframe);

                        iframe.contentWindow.document.open();
                        iframe.contentWindow.document.write(html);
                        iframe.contentWindow.document.close();
                    } catch (err) {
                        alert('Error loading site: ' + err.message);
                    }
                }
                </script>


            </div>
        </div>
    </div>
    <script src="load-navbar.js"></script>
</body>
</html>
