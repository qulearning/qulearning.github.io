                <script>
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', async () => {
                        try {
                            const registration = await navigator.serviceWorker.register('sw.js');
                            console.log('Service Worker registered');

                            await navigator.serviceWorker.ready;

                            document.querySelectorAll('button[data-cache]').forEach(btn => {
                                btn.addEventListener('click', () => {
                                    const files = JSON.parse(btn.dataset.cache);
                                    registration.active?.postMessage({ type: 'CACHE_FILES', files });
                                    console.log('Sent files to Service Worker for caching:', files);
                                });
                            });

                        } catch(e) {
                            console.error('SW registration failed:', e);
                        }
                    });
                }
                </script>
